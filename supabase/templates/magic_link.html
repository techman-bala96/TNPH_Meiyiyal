<h2>Sign in to Meiyiyal</h2>
<p><a href="{{ if and (ge (len .RedirectTo) 8) (eq (slice .RedirectTo 0 8) "https://") }}{{ .SiteURL }}/auth/v1/verify?token={{ .TokenHash }}&type=magiclink&redirect_to={{ .RedirectTo }}{{ else }}{{ .ConfirmationURL }}{{ end }}">Sign in</a></p>
<p>Or enter this code: {{ .Token }}</p>
