# coturn for Meiyiyal calls (TURN REST API auth). Copy to /etc/turnserver.conf on the TURN VM.
# The same secret goes into the Edge Function secret TURN_SECRET. Never commit the real value.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=turn.meiyiyal.com
server-name=turn.meiyiyal.com
# Public IP of the VM (and private IP if behind 1:1 NAT, e.g. AWS/GCP): external-ip=PUBLIC/PRIVATE
external-ip=__PUBLIC_IP__
# Let's Encrypt certificate for turn.meiyiyal.com (certbot certonly --standalone -d turn.meiyiyal.com)
cert=/etc/letsencrypt/live/turn.meiyiyal.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.meiyiyal.com/privkey.pem
# relay port range — open UDP 49152-65535 (and 3478 udp/tcp, 5349 tcp) in the firewall
min-port=49152
max-port=65535
# safety: no relaying to private networks, no loopback peers, no multicast
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
total-quota=300
user-quota=4
stale-nonce=600
no-cli
log-file=stdout
simple-log
